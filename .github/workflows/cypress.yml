name: Cypress CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API
        working-directory: ./planeta-qa
        run: mvn clean package -DskipTests

      - name: Start API
        working-directory: ./planeta-qa
        run: |
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 45

      - name: Verify API
        run: curl http://localhost:8081/products

      - name: Install E2E dependencies
        working-directory: ./planeta-qa-e2e
        run: npm install

      - name: Run Cypress
        working-directory: ./planeta-qa-e2e
        run: npx cypress run