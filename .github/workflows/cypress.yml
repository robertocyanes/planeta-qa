name: Cypress CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  cypress-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build API
        run: |
          cd planeta-qa
          mvn clean package -DskipTests

      - name: Start API
        run: |
          cd planeta-qa
          nohup mvn spring-boot:run > app.log 2>&1 &
          sleep 40

      - name: Verify API
        run: |
          curl http://localhost:8081/products

      - name: Install Cypress Dependencies
        run: |
          cd planeta-qa-e2e
          npm install

      - name: Run Cypress
        run: |
          cd planeta-qa-e2e
          npx cypress run